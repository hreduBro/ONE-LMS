
<div class="flex h-screen bg-base-200 font-sans overflow-hidden">
  <!-- Dynamic Sidebar (Handles Desktop Classic, Desktop Rail, and Mobile Slide-Out Drawer) -->
  <app-sidebar [isOpen]="isSidebarOpen()" (close)="closeSidebar()"></app-sidebar>
  
  <div class="flex-1 flex flex-col overflow-hidden min-w-0">
    <app-header (toggleSidebar)="toggleSidebar()"></app-header>

    <!-- Top Menu Bar (Rendered on Desktop when navigationMode is 'top_menu') -->
    @if (lms.adminLayoutPreferences().navigationMode === 'top_menu') {
      <div class="hidden lg:block flex-shrink-0">
        <app-top-menu></app-top-menu>
      </div>
    }
    
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-base-100 pb-20 lg:pb-6">
      <div [class]="lms.adminLayoutPreferences().contentWidth === 'fluid' ? 'w-full px-3.5 sm:px-6 lg:px-8 py-4 sm:py-6' : 'max-w-7xl mx-auto px-3.5 sm:px-6 lg:px-8 py-4 sm:py-6'">
        <!-- The main content will be rendered here based on the route. -->
        <router-outlet></router-outlet>
      </div>
    </main>

    <!-- Mobile Bottom Tab Navigation -->
    <app-mobile-nav></app-mobile-nav>
  </div>
</div>
