
<div class="flex h-screen bg-base-200 font-sans overflow-hidden">
  <!-- Dynamic Sidebar (Handles Desktop Classic, Desktop Rail, and Mobile Slide-Out Drawer) -->
  <app-sidebar [isOpen]="isSidebarOpen()" (close)="closeSidebar()"></app-sidebar>
  
  <div class="flex-1 flex flex-col overflow-hidden min-w-0">
    <app-header (toggleSidebar)="toggleSidebar()"></app-header>

    <!-- Top Menu Bar (Rendered on Desktop when navigationMode is 'top_menu') -->
    @if (lms.adminLayoutPreferences().navigationMode === 'top_menu') {
      <div class="hidden lg:block flex-shrink-0 relative z-30">
        <app-top-menu></app-top-menu>
      </div>
    }
    
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-base-100 pb-20 lg:pb-6 relative">
      <!-- Global Toast Alert Banner -->
      @if (lms.currentToast(); as toast) {
        <div class="fixed top-5 right-5 z-50 max-w-md animate-in fade-in slide-in-from-top-4 duration-300">
          <div 
            class="px-4 py-3 rounded-2xl shadow-xl border flex items-center justify-between gap-3 text-xs font-semibold"
            [ngClass]="{
              'bg-emerald-500 text-white border-emerald-400': toast.type === 'success',
              'bg-rose-500 text-white border-rose-400': toast.type === 'error',
              'bg-indigo-600 text-white border-indigo-500': toast.type === 'info'
            }">
            <div class="flex items-center gap-2">
              <span class="material-symbols-outlined text-base">
                @if (toast.type === 'success') { check_circle }
                @else if (toast.type === 'error') { error }
                @else { info }
              </span>
              <span>{{ toast.message }}</span>
            </div>
            <button (click)="lms.clearToast()" class="p-1 rounded-lg hover:bg-white/20 transition-colors">
              <span class="material-symbols-outlined text-sm">close</span>
            </button>
          </div>
        </div>
      }

      <div [class]="lms.adminLayoutPreferences().contentWidth === 'fluid' ? 'w-full px-3.5 sm:px-6 lg:px-8 py-4 sm:py-6' : 'max-w-7xl mx-auto px-3.5 sm:px-6 lg:px-8 py-4 sm:py-6'">
        <!-- The main content will be rendered here based on the route. -->
        <router-outlet></router-outlet>
      </div>
    </main>

    <!-- Mobile Bottom Tab Navigation -->
    <app-mobile-nav></app-mobile-nav>
  </div>
</div>
