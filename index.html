  <script>
    (function() {
      try {
        var saved = localStorage.getItem('lms_theme_mode');
        var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || ((!saved || saved === 'system') && systemDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch(e) {}
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Cinzel:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            serif: ['Cinzel', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            tenant: {
              50: 'var(--tenant-50, #eef2ff)',
              100: 'var(--tenant-100, #e0e7ff)',
              200: 'var(--tenant-200, #c7d2fe)',
              300: 'var(--tenant-300, #a5b4fc)',
              400: 'var(--tenant-400, #818cf8)',
              500: 'var(--tenant-primary, #6366f1)',
              600: 'var(--tenant-primary-hover, #4f46e5)',
              700: 'var(--tenant-primary-dark, #4338ca)',
              accent: 'var(--tenant-accent, #ec4899)',
            },
            'brand-primary': 'var(--brand-primary)',
            'brand-secondary': 'var(--brand-secondary)',
            'base-100': 'var(--base-100)',
            'base-200': 'var(--base-200)',
            'base-300': 'var(--base-300)',
            'text-primary': 'var(--text-primary)',
            'text-secondary': 'var(--text-secondary)',
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --tenant-primary: #4f46e5;
      --tenant-primary-hover: #4338ca;
      --tenant-primary-dark: #3730a3;
      --tenant-accent: #06b6d4;
      --tenant-50: #eef2ff;
      --tenant-100: #e0e7ff;
      --tenant-200: #c7d2fe;
      --tenant-300: #a5b4fc;
      --tenant-400: #818cf8;
      
      /* Default Light Theme */
      --brand-primary: #4f46e5;
      --brand-secondary: #06b6d4;
      --base-100: #ffffff;
      --base-200: #f8fafc;
      --base-300: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
    }

    html.dark {
      --base-100: #0f172a;
      --base-200: #1e293b;
      --base-300: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --tenant-50: rgba(99, 102, 241, 0.12);
      --tenant-100: rgba(99, 102, 241, 0.22);
      --tenant-200: #c7d2fe;
      --tenant-300: #a5b4fc;
      --tenant-400: #818cf8;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      font-size: 20px;
      line-height: 1;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    html.dark ::-webkit-scrollbar-thumb {
      background: #475569;
    }
  </style>
