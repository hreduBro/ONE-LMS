  <script>
    (function() {
      try {
        var saved = localStorage.getItem('lms_theme_mode');
        var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || ((!saved || saved === 'system') && systemDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch(e) {}

      // Gracefully prevent unhandled promise rejections and errors from third-party browser extensions (e.g. MetaMask, Web3 wallets)
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason) {
          var reasonStr = '';
          try {
            reasonStr = (event.reason.message || event.reason.stack || event.reason.toString() || '').toLowerCase();
          } catch(e) {}
          if (reasonStr.indexOf('metamask') !== -1 || reasonStr.indexOf('ethereum') !== -1 || reasonStr.indexOf('wallet') !== -1) {
            event.preventDefault();
            event.stopPropagation();
            console.debug('[OmniLearn Extension Bridge] Handled third-party wallet event gracefully.');
          }
        }
      });

      window.addEventListener('error', function(event) {
        if (event) {
          var msg = '';
          var filename = (event.filename || '').toLowerCase();
          try {
            msg = (event.message || (event.error && event.error.message) || '').toLowerCase();
          } catch(e) {}
          if (msg.indexOf('metamask') !== -1 || msg.indexOf('ethereum') !== -1 || msg.indexOf('wallet') !== -1 || filename.indexOf('chrome-extension') !== -1 || filename.indexOf('moz-extension') !== -1) {
            event.preventDefault();
            event.stopPropagation();
            console.debug('[OmniLearn Extension Bridge] Handled third-party extension error gracefully.');
            return true;
          }
        }
      });
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            serif: ['Cinzel', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            tenant: {
              50: 'var(--tenant-50, #eef2ff)',
              100: 'var(--tenant-100, #e0e7ff)',
              200: 'var(--tenant-200, #c7d2fe)',
              300: 'var(--tenant-300, #a5b4fc)',
              400: 'var(--tenant-400, #818cf8)',
              500: 'var(--tenant-primary, #6366f1)',
              600: 'var(--tenant-primary-hover, #4f46e5)',
              700: 'var(--tenant-primary-dark, #4338ca)',
              accent: 'var(--tenant-accent, #ec4899)',
            },
            'brand-primary': 'var(--brand-primary)',
            'brand-secondary': 'var(--brand-secondary)',
            'base-100': 'var(--base-100)',
            'base-200': 'var(--base-200)',
            'base-300': 'var(--base-300)',
            'text-primary': 'var(--text-primary)',
            'text-secondary': 'var(--text-secondary)',
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --tenant-primary: #EC008C;
      --tenant-primary-hover: #D8007E;
      --tenant-primary-dark: #B8006C;
      --tenant-accent: #C40072;
      --tenant-50: #FDF2F8;
      --tenant-100: #FCE7F3;
      --tenant-200: #FBCFE8;
      --tenant-300: #F9A8D4;
      --tenant-400: #F472B6;
      
      /* Default Light Theme - BRAC Pantone Magenta */
      --brand-primary: #EC008C;
      --brand-secondary: #C40072;
      --base-100: #ffffff;
      --base-200: #f8fafc;
      --base-300: #f1f5f9;

      --tenant-300: #f9a8d4;
      --tenant-400: #f472b6;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* ========================================================================= */
    /* UNIVERSAL BRAC BUTTON GRADIENT SYSTEM                                    */
    /* ========================================================================= */
    .btn-gradient,
    .btn-primary,
    .btn-brac-gradient,
    button:not([disabled]):is(.btn-gradient, .btn-primary, .btn-brac-gradient, [class*="bg-tenant-500"], [class*="bg-tenant-600"], [class*="bg-indigo-600"], [class*="bg-primary"]),
    a:is(.btn-gradient, .btn-primary, .btn-brac-gradient, [class*="bg-tenant-500"], [class*="bg-tenant-600"], [class*="bg-indigo-600"], [class*="bg-primary"]) {
      background: linear-gradient(135deg, #EC008C 0%, #C40072 100%) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 14px 0 rgba(236, 0, 140, 0.32);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-gradient:hover,
    .btn-primary:hover,
    .btn-brac-gradient:hover,
    button:not([disabled]):is(.btn-gradient, .btn-primary, .btn-brac-gradient, [class*="bg-tenant-500"], [class*="bg-tenant-600"], [class*="bg-indigo-600"], [class*="bg-primary"]):hover,
    a:is(.btn-gradient, .btn-primary, .btn-brac-gradient, [class*="bg-tenant-500"], [class*="bg-tenant-600"], [class*="bg-indigo-600"], [class*="bg-primary"]):hover {
      background: linear-gradient(135deg, #FF1A9B 0%, #D8007E 100%) !important;
      box-shadow: 0 6px 20px 0 rgba(236, 0, 140, 0.45);
      transform: translateY(-1px);
    }

    .btn-gradient:active,
    .btn-primary:active,
    .btn-brac-gradient:active,
    button:not([disabled]):is(.btn-gradient, .btn-primary, .btn-brac-gradient, [class*="bg-tenant-500"], [class*="bg-tenant-600"], [class*="bg-indigo-600"], [class*="bg-primary"]):active,
    a:is(.btn-gradient, .btn-primary, .btn-brac-gradient, [class*="bg-tenant-500"], [class*="bg-tenant-600"], [class*="bg-indigo-600"], [class*="bg-primary"]):active {
      transform: translateY(0);
      box-shadow: 0 2px 8px 0 rgba(236, 0, 140, 0.25);
    }

    /* Amber / Certificate gradient buttons */
    button:not([disabled]):is([class*="bg-amber-500"], [class*="bg-amber-600"]),
    a:is([class*="bg-amber-500"], [class*="bg-amber-600"]) {
      background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 14px 0 rgba(245, 158, 11, 0.35);
      transition: all 0.2s ease-in-out;
    }
    button:not([disabled]):is([class*="bg-amber-500"], [class*="bg-amber-600"]):hover,
    a:is([class*="bg-amber-500"], [class*="bg-amber-600"]):hover {
      background: linear-gradient(135deg, #FBBF24 0%, #EA580C 100%) !important;
      transform: translateY(-1px);
    }

    /* Emerald / Success gradient buttons */
    button:not([disabled]):is([class*="bg-emerald-500"], [class*="bg-emerald-600"]),
    a:is([class*="bg-emerald-500"], [class*="bg-emerald-600"]) {
      background: linear-gradient(135deg, #10B981 0%, #059669 100%) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.35);
      transition: all 0.2s ease-in-out;
    }
    button:not([disabled]):is([class*="bg-emerald-500"], [class*="bg-emerald-600"]):hover,
    a:is([class*="bg-emerald-500"], [class*="bg-emerald-600"]):hover {
      background: linear-gradient(135deg, #34D399 0%, #047857 100%) !important;
      transform: translateY(-1px);
    }

    /* Secondary gradient accent buttons */
    .btn-gradient-secondary {
      background: linear-gradient(135deg, #FDF2F8 0%, #FCE7F3 100%);
      color: #B8006C;
      border: 1px solid #FBCFE8;
      transition: all 0.2s ease-in-out;
    }
    .dark .btn-gradient-secondary {
      background: linear-gradient(135deg, rgba(236, 0, 140, 0.15) 0%, rgba(196, 0, 114, 0.25) 100%);
      color: #F9A8D4;
      border-color: rgba(236, 0, 140, 0.3);
    }
    .btn-gradient-secondary:hover {
      background: linear-gradient(135deg, #FCE7F3 0%, #FBCFE8 100%);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px 0 rgba(236, 0, 140, 0.15);
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      vertical-align: middle;
      font-size: 20px;
      line-height: 1;
    }
    .material-symbols-outlined.fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    html.dark ::-webkit-scrollbar-thumb {
      background: #475569;
    }
